# Linux: the test suite, then a smoke test against a real PulseAudio server and the notch on an X display.
name: Linux tests

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2 libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 \
            libxcb-render-util0 libxcb-image0 libdbus-1-3 xvfb xdotool x11-utils pulseaudio pulseaudio-utils

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest pytest-timeout

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v --timeout 60 -p no:cacheprovider

      - name: Smoke test (PulseAudio, X11, the notch)
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=speakers sink_properties=device.description=Speakers
          pactl set-default-sink speakers
          AGENT_VOICE_HOME=$RUNNER_TEMP/av xvfb-run -a python scripts/linux_smoke.py
