[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-voice"
version = "0.1.0"
description = "Local, CPU-only voice for AI coding agents (Claude Code, Codex, Gemini CLI, Cursor, Antigravity): speaks replies in French or English, push-to-talk dictation."
requires-python = ">=3.10"
dependencies = [
    "piper-tts>=1.3",
    "sounddevice",
    "numpy",
    "lingua-language-detector",
    "faster-whisper",
    "keyboard",
    "pyperclip",
]

[project.scripts]
agent-voice = "agent_voice.cli:main"

[tool.setuptools]
packages = ["agent_voice"]
