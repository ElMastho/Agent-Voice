# macOS: the test suite on every push (the app runs from source there; the release build is Windows-only).
name: macOS tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
