[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-voice"
version = "0.11.0"
description = "Local, CPU-only voice for AI coding agents (Claude Code, Codex, Gemini CLI, Cursor, Antigravity): speaks replies in French or English, push-to-talk dictation."
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "ElMastho" }]
readme = "README.md"
dependencies = [
    "piper-tts>=1.3",
    "sounddevice",
    "numpy",
    "lingua-language-detector",
    "py3langid",
    "sherpa-onnx",
    "faster-whisper",
    "keyboard; sys_platform == 'win32'",
    "pyperclip",
    "comtypes; sys_platform == 'win32'",
    "PySide6-Essentials",
    "pyte",
    "qrcode",
    "pywinpty; sys_platform == 'win32'",
    "pycaw; sys_platform == 'win32'",
    "winrt-Windows.Media.Control; sys_platform == 'win32'",
    "winrt-Windows.Foundation; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams; sys_platform == 'win32'",
    "kokoro-onnx",
    "pynput; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = ["pytest", "pillow"]

[project.scripts]
agent-voice = "agent_voice.cli:main"

[tool.setuptools]
packages = ["agent_voice", "agent_voice.daemon"]

[tool.setuptools.package-data]
agent_voice = ["browser/*"]
